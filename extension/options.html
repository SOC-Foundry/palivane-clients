<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Palivane, Shadow-AI Guard</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 460px; margin: 32px auto; color: #111; }
    h1 { font-size: 18px; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input[type=text], input[type=url] { width: 100%; padding: 8px; box-sizing: border-box; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
    button { margin-top: 18px; padding: 9px 16px; font-weight: 700; cursor: pointer; }
    .saved { color: #1a7f37; margin-left: 10px; }
    small { color: #666; }
  </style>
</head>
<body>
  <h1>◆ Palivane, Shadow-AI Guard</h1>
  <p><small>Inspects prompts sent to ChatGPT / Claude / Gemini for secrets, PII, and
  proprietary data before they leave.</small></p>

  <label>Palivane backend URL</label>
  <input id="backendUrl" type="url" placeholder="http://localhost:8090" />

  <label>Ingest token</label>
  <input id="token" type="text" placeholder="EXTENSION_INGEST_TOKEN value" />

  <label>User identity (optional)</label>
  <input id="user" type="text" placeholder="alice@company.com" />
  <small>In a managed rollout this is set from SSO; leave blank otherwise.</small>

  <div class="row">
    <input id="enforce" type="checkbox" />
    <label for="enforce" style="margin:0;">Enforce (block risky prompts; off = warn only)</label>
  </div>

  <button id="save">Save</button>
  <span id="saved" class="saved"></span>

  <script src="options.js"></script>
</body>
</html>
